<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2430" />
  <title>TaskDesk</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- 로그인 -->
  <section id="login" class="login hidden">
    <div class="login-box">
      <div class="brand"><span class="logo">✓</span> TaskDesk</div>
      <p class="muted">PC 앱과 같은 계정으로 로그인하세요.</p>
      <form id="login-form">
        <input id="l-email" type="email" placeholder="이메일" autocomplete="username" required />
        <input id="l-pass" type="password" placeholder="비밀번호" autocomplete="current-password" required />
        <button class="btn primary" type="submit">로그인</button>
        <p class="error" id="l-error"></p>
      </form>
    </div>
  </section>

  <!-- 앱 -->
  <div id="app" class="hidden">
    <header class="top">
      <div class="top-row">
        <div class="title"><span class="logo">✓</span><b id="today-label"></b></div>
        <span class="sync-dot" id="sync-dot" title=""></span>
      </div>
      <div class="seg" id="space-switch">
        <button data-space="all">전체</button>
        <button data-space="work">💼 회사</button>
        <button data-space="personal">🏠 개인</button>
      </div>
    </header>

    <main id="main">
      <!-- 빠른 추가 (오늘 / 전체) -->
      <form class="add" id="add-form">
        <div class="add-row">
          <input id="add-input" placeholder="할 일 추가 (예: 견적 회신 내일 3시 #영업)" autocomplete="off" enterkeyhint="done" />
          <button class="btn primary" type="submit">추가</button>
        </div>
        <div id="add-when"></div>
        <div class="added hidden" id="added"></div>
      </form>

      <section class="view" id="view-today"></section>

      <section class="view hidden" id="view-all">
        <div class="filters">
          <input id="f-search" placeholder="검색" />
          <select id="f-status">
            <option value="open">진행 중</option>
            <option value="done">완료</option>
            <option value="">전체</option>
          </select>
        </div>
        <div id="all-list"></div>
      </section>

      <section class="view hidden" id="view-memo">
        <div class="memo-compose">
          <textarea id="m-input" rows="3" placeholder="떠오른 걸 바로 적어두세요"></textarea>
          <button class="btn primary" id="m-save">저장</button>
        </div>
        <div id="m-list" class="m-list"></div>
      </section>

      <section class="view hidden" id="view-settings">
        <div class="card">
          <h3>계정</h3>
          <p>로그인: <b id="s-email"></b></p>
          <p class="muted" id="s-sync"></p>
          <div class="btns">
            <button class="btn" id="s-sync-now">지금 동기화</button>
            <button class="btn danger" id="s-logout">로그아웃</button>
          </div>
        </div>
        <div class="card">
          <h3>분류 관리</h3>
          <p class="muted small">이름을 바꾸면 그 분류의 업무에도 반영되고, 공간을 바꾸면 업무도 함께 옮겨가요.</p>
          <div id="cat-list"></div>
          <form class="cat-add" id="cat-add">
            <input type="color" id="cat-add-color" value="#4f63f0" />
            <input id="cat-add-name" placeholder="새 분류 이름" autocomplete="off" />
            <select id="cat-add-space">
              <option value="work">💼 회사</option>
              <option value="personal">🏠 개인</option>
            </select>
            <button class="btn primary" type="submit">추가</button>
          </form>
        </div>
        <div class="card">
          <h3>알림</h3>
          <p class="muted" id="s-push-state"></p>
          <div class="btns"><button class="btn primary" id="s-push">이 휴대폰에서 알림 받기</button></div>
          <label class="check"><input type="checkbox" id="s-workoff" /> 💼 회사 업무 알림은 휴대폰으로 받지 않기</label>
        </div>
        <div class="card">
          <h3>앱처럼 쓰기</h3>
          <p class="muted">크롬 메뉴(⋮) → <b>홈 화면에 추가</b>(또는 앱 설치)를 누르면 아이콘으로 바로 열 수 있어요.</p>
        </div>
        <p class="muted small">반복 업무의 다음 회차와 조건부 분기 판단은 PC 앱이 처리해요.</p>
      </section>
    </main>

    <nav class="tabs" id="tabs">
      <button data-tab="today" class="active"><span>📌</span>오늘<i class="badge" id="b-today"></i></button>
      <button data-tab="all"><span>📋</span>전체</button>
      <button data-tab="memo"><span>📝</span>메모</button>
      <button data-tab="settings"><span>⚙️</span>설정</button>
    </nav>
  </div>

  <!-- 업무 편집 -->
  <div class="sheet-back hidden" id="sheet-back"></div>
  <form class="sheet hidden" id="sheet">
    <div class="sheet-head">
      <button type="button" class="btn ghost" id="e-cancel">취소</button>
      <b id="e-title">업무</b>
      <button type="submit" class="btn primary">저장</button>
    </div>
    <div class="sheet-body">
      <div class="seg small" id="e-space">
        <button type="button" data-space="work">💼 회사</button>
        <button type="button" data-space="personal">🏠 개인</button>
      </div>
      <label>제목<input name="title" required autocomplete="off" /></label>
      <div class="grid2">
        <label>분류<select name="project" id="e-project"></select></label>
        <label>상태
          <select name="status">
            <option value="todo">할 일</option>
            <option value="doing">진행 중</option>
            <option value="done">완료</option>
          </select>
        </label>
      </div>
      <div class="new-cat hidden" id="e-newcat">
        <input type="color" id="e-newcat-color" value="#4f63f0" />
        <input id="e-newcat-name" placeholder="새 분류 이름" autocomplete="off" />
        <button type="button" class="btn small primary" id="e-newcat-add">추가</button>
        <button type="button" class="btn small" id="e-newcat-cancel">취소</button>
      </div>
      <div class="grid2">
        <label>마감일<input type="date" name="dueDate" /></label>
        <label>마감 시각<input type="time" name="dueTime" /></label>
      </div>
      <div class="grid2">
        <label>시작일<input type="date" name="startDate" /></label>
        <label>우선순위
          <select name="priority">
            <option value="high">🔴 높음</option>
            <option value="mid">🟡 보통</option>
            <option value="low">🟢 낮음</option>
          </select>
        </label>
      </div>
      <div class="grid2">
        <label>미리 알림
          <select name="remindBefore">
            <option value="0">마감 시각에만</option>
            <option value="10">10분 전</option>
            <option value="30">30분 전</option>
            <option value="60">1시간 전</option>
            <option value="180">3시간 전</option>
            <option value="1440">하루 전</option>
          </select>
        </label>
        <label>반복
          <select name="repeat">
            <option value="none">반복 안 함</option>
            <option value="daily">매일</option>
            <option value="weekdays">평일마다</option>
            <option value="weekly">매주</option>
            <option value="monthly">매월</option>
          </select>
        </label>
      </div>
      <div class="box">
        <div class="box-head">세부 업무 <span id="e-sub-prog"></span></div>
        <div id="e-subs"></div>
        <div class="sub-add">
          <input id="e-sub-text" placeholder="세부 업무 추가" autocomplete="off" />
          <input id="e-sub-date" type="date" />
          <input id="e-sub-time" type="time" />
          <button type="button" class="btn" id="e-sub-add">＋</button>
        </div>
      </div>
      <div class="box" id="e-deps-box">
        <div class="box-head">선행 업무 <span class="muted small">이 업무 전에 끝나야 하는 일</span></div>
        <div id="e-deps"></div>
        <select id="e-dep-add"></select>
        <div class="muted small" id="e-succ"></div>
        <div class="succ-btns hidden" id="e-succ-btns">
          <span class="muted small">이 업무 다음에:</span>
          <button type="button" class="btn small" data-succ="always">＋ 후행</button>
          <button type="button" class="btn small" data-succ="ontime">＋ 기한 내 완료 시</button>
          <button type="button" class="btn small" data-succ="late">＋ 못 끝나면(대안)</button>
        </div>
      </div>
      <label>메모<textarea name="memo" rows="3"></textarea></label>
      <button type="button" class="btn danger wide" id="e-delete">이 업무 삭제</button>
    </div>
  </form>

  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="sync.js"></script>
  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
